name: My Custom Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  my-job-name:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
   
    steps:
      - name: Cleanup Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Cleanup Workspace
        run: rm -rf ${{ github.workspace }}/*

      - name: Set-up main directory with stripped clang and jdk21
        run: |
          git clone --depth 1 --single-branch -b main https://gitlab.com/dogpoopy/blobs_extractor.git .
          rm -rf .git
        
      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub
          chmod 600 ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa.pub
          cat ~/.ssh/id_rsa.pub
          ssh-keyscan -t rsa gitlab.com >> ~/.ssh/known_hosts
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
          git config --global user.name "${{ secrets.GIT_USER_NAME }}"
          git config --global user.email "${{ secrets.GIT_USER_EMAIL }}"
          sleep 60
          

      - name: Clone repositories
        run: |
          git clone https://dumps.tadiphone.dev/dumps/xiaomi/chenfeng.git -b missi-user-15-AQ3A.240912.001-OS2.0.2.0.VNJINXM-release-keys ~/holi 
          git clone https://github.com/Fake-suns/android_device_xiaomi_miuicamera-chenfeng.git device/xiaomi/miuicamera-chenfeng
          git clone https://github.com/LineageOS/android_tools_extract-utils.git tools/extract-utils
          git clone https://github.com/LineageOS/android_prebuilts_extract-tools.git prebuilts/extract-tools


      - name: Set up and run scripts
        run: |
          export PYTHONPATH=tools/extract-utils
          python3 device/xiaomi/miuicamera-chenfeng/setup-makefiles.py ~/holi
          python3 device/xiaomi/miuicamera-chenfeng/extract-files.py ~/holi

      - name: Initialize and push vendor/avalon
        run: |
          cd vendor/xiaomi/miuicamera-chenfeng
          git init 
          git lfs install
          git lfs track "**"
          git add .
          git commit -m "first commit"
          git branch -M main 
          git remote add origin ssh://git@codeberg.org/cyberDay777/Mxam.git
          git push -u origin main
